[project]
name = "nabote"
version = "0.1.0"
description = "Instrumento analítico interno de mapeamento do discurso público brasileiro"
requires-python = ">=3.11"
# Uma dependência, adicionada no passo 1: cliente WebSocket para o Jetstream.
# O parser, o schema e a CLI continuam em biblioteca padrão — `websockets` só é
# importado dentro de JetstreamSource, então os testes rodam sem ele instalado.
# igraph entra no passo 2, sentence-transformers no passo 3.
dependencies = ["websockets>=13"]

[project.scripts]
nabote = "nabote.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
